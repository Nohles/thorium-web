# Publish merged releases from the integration branch.
publishBranch: develop

ignoreScripts: true

# All Readium consumers must share the patched model classes, including
# upstream packages whose dependency still pins the original stable version.
overrides:
  "@readium/shared": "2.8.0-nohles.1"

manage-package-manager-versions: true

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@readium/*"
  # Reviewed local fork, qualified with the matching 2.14 dependency set.
  - "@nohles/readium-navigator"
blockExoticSubdeps: true
trustPolicy: no-downgrade
# undici's 5.x maintenance line was never wired into npm provenance attestation,
# unlike its 6.x/7.x mainline releases from the same maintainer (matteo.collina) -
# a publish-pipeline gap, not a trust downgrade.
trustPolicyExclude:
  - "undici"
